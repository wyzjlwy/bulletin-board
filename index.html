<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tougaloo College Bulletin Board</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
  #screen{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
  #slide{width:100%;height:100%;object-fit:contain;display:block}
</style>
</head>
<body>
<div id="screen"><img id="slide" alt="Department bulletin board slide"></div>
<script>
  const slides = [
    'slides1.png', 'slides2.png', 'slides3.png', 'slides4.png',
    'slides5.png', 'slides6.png', 'slides7.png', 'slides8.png'
  ];
  const intervalMs = 10000;
  let current = 0;
  const image = document.getElementById('slide');
  function showSlide() {
    image.src = slides[current];
    current = (current + 1) % slides.length;
  }
  showSlide();
  setInterval(showSlide, intervalMs);
</script>
</body>
</html>
